    ::CAPTCHA_BOX_JS::

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0a0f; 
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .verification-card {
            background: rgba(20, 18, 26, 0.85);
            border: 1px solid rgba(255, 136, 0, 0.2); 
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 50px rgba(255, 110, 0, 0.08);
            backdrop-filter: blur(10px);
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .panel-logo {
            width: 150px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 110, 0, 0.4)); 
        }

        .brand-title {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .status-message {
            font-size: 18px;
            font-weight: 500;
            color: #f8fafc;
            margin-bottom: 12px;
        }

        .sub-text {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .captcha-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 10px;
        }

        .footer-note {
            font-size: 12px;
            color: #475569;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
        }

        .ray-id {
            font-family: monospace;
            color: #64748b;
            margin-top: 8px;
            font-size: 11px;
        }
    </style>
</head>
